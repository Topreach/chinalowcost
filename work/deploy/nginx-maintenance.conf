# Add these inside the chinalowcost.com HTTPS server block only.
# The normal location / must proxy to 127.0.0.1:3100.
error_page 502 503 504 /maintenance.html;
location = /maintenance.html {
    internal;
    root /opt/chinalowcost/public-maintenance;
    add_header Retry-After 60 always;
    add_header Cache-Control "no-store" always;
}
