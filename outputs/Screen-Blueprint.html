lication":"Admin","Screen":"Integration health and retry queues","Primary action":"Resolve provider failure","Access":"Technical administrator","Key states":"Dead letter / outage / secret rotation","MVP stage":"3"},{"ID":"A31","Application":"Admin","Screen":"Promotions and discount rules","Primary action":"Configure approved promotion","Access":"Sales manager with approval","Key states":"Expired / cap reached / ineligible / inactive","MVP stage":"1"},{"ID":"A32","Application":"Admin","Screen":"Nigeria delivery zones and transport rates","Primary action":"Configure destination pricing","Access":"Operations manager with approval","Key states":"Unconfigured town / weight surcharge / inactive route","MVP stage":"1"},{"ID":"A33","Application":"Admin","Screen":"Workers teams and assignments","Primary action":"Manage approved staff teams","Access":"Operations manager","Key states":"Pending activation / suspended / overloaded","MVP stage":"2"},{"ID":"A34","Application":"Admin","Screen":"Worker activity and tracking","Primary action":"Review on-shift check-ins","Access":"Scoped operations manager","Key states":"Consent missing / stale check-in / off shift","MVP stage":"2"},{"ID":"A35","Application":"Admin","Screen":"Product images and video collection","Primary action":"Collect rights-approved product media","Access":"Catalog preparer and reviewer","Key states":"Missing rights / reattach file / processing / rejected","MVP stage":"2"},{"ID":"A36","Application":"Admin","Screen":"Category and attribute administration","Primary action":"Review product schemas","Access":"Independent catalog reviewer","Key states":"Missing specification / incompatible category / draft version","MVP stage":"2"},{"ID":"A38","Application":"Admin","Screen":"Admin login","Primary action":"Sign in to admin account","Access":"Public","Key states":"Invalid credentials / permission / lockout","MVP stage":"1"},{"ID":"A39","Application":"Admin","Screen":"Worker login management","Primary action":"Create or remove worker access","Access":"Manager admin","Key states":"Duplicate email / invalid role / removed access","MVP stage":"1"},{"ID":"A40","Application":"Admin","Screen":"Admin password recovery","Primary action":"Reset own admin password","Access":"Public","Key states":"Invalid recovery code / revoked sessions","MVP stage":"1"},{"ID":"A41","Application":"Admin","Screen":"Admin account security","Primary action":"Change password or sign out","Access":"Authenticated scoped admin","Key states":"Wrong password / expired session / scope restriction","MVP stage":"1"}];</script><script>/* ChinaLowCost connected design prototype. Local sample data only. No network calls. */
const $ = id => document.getElementById(id);

 {id:'FAN-01',name:'Rechargeable desk fan',category:'Electronics',art:'fan',retail:5000,bulk:4500,volume:4000,moq:10,pack:5,variant:'Sage',tag:'Wholesale favourite'},
 {id:'LMP-02',name:'Minimal table lamp',category:'Home & living',art:'lamp',retail:8500,bulk:7200,volume:6500,moq:10,pack:5,variant:'Sand',tag:'Home collection'},

];

let state = initialState();
try{const saved=JSON.parse(localStorage.getItem('clc-prototype-v3'));if(saved)state={...state,...saved};}catch{}

function toast(message){$('toast').textContent=message;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',4200);}
function go(id){if(!PAGES.some(p=>p.ID===id))return;scenario='normal';if(location.hash==='#'+id)render();else location.hash=id;}
function art(p,cls=''){return `<svg class="${cls}" role="img" aria-label="${esc(p.name)} illustration"><use href="#${p.art}"/></svg>`;}

function timeline(items){return `<ol class="timeline">${items.map(([title,sub,pending])=>`<li class="${pending?'pending':''}"><strong>${title}</strong><small>${sub}</small></li>`).join('')}</ol>`;}

function rate(p,q,mode=state.mode){return mode==='retail'?p.retail:q>=50?p.volume:p.bulk;}
function validQty(p,q,mode=state.mode){return Number.isSafeInteger(q)&&q>0&&q<=100000&&(mode==='retail'||q>=p.moq&&q%p.pack===0);}

function orderSummary(){const t=totals();return row('Goods subtotal',money(t.goods))+row('Delivery · sample flat fee',money(t.delivery))+row('Tax','Not configured for demo')+'<hr class="divider">'+row('Order total',`<span class="amount">${money(t.total)}</span>`);}
function heading(title,desc='',actions=''){return `<div class="pagehead"><div><h1 tabindex="-1" id="page-title">${title}</h1>${desc?`<p>${desc}</p>`:''}</div>${actions?`<div class="actions">${actions}</div>`:''}</div>`;}
const customerNames={C01:'Welcome to ChinaLowCost',C02:'Discover something better',C03:'Shop the collection',C04:'Search our catalog',C05:'Find it with a photo',C06:'Similar products',C07:'Product details',C08:'Wholesale calculator',C09:'Your quotations',C10:'Shopping cart',C11:'Where should we deliver?',C12:'Review your order',C13:'Choose how to pay',C14:'Transfer & pay on delivery',C15:'Your orders',C16:'Follow your delivery',C17:'See it. Know it. Shop it.',C18:'We’re here to help',C19:'Returns & resolutions',C20:'Your account',C21:'Receipts & refunds'};

function navLabel(p){return ({A01:'Overview',A02:'Staff approvals',A03:'Roles & access',A04:'Suppliers',A05:'Banking & terms',A06:'Visits & assignments',A07:'Products & variants',A08:'Catalog review',A09:'Pricing',A10:'Stock & reservations',A11:'Quotations',A12:'Orders',A13:'Purchase orders',A14:'Goods receipts',A15:'Dispatch board',A16:'Delivery incidents',A17:'Payments',A18:'Cash reconciliation',A19:'Refunds',A20:'Supplier settlements',A21:'Returns',A22:'Customers & support',A23:'WhatsApp inbox',A24:'Video library',A25:'AI review',A26:'Approval center',A27:'Reports & ledger',A28:'Business settings',A29:'Audit trail',A30:'Integration health'})[p.ID]||workerNames[p.ID]||customerNames[p.ID];}
function shell(content,page){const app=page.Application;const isCustomer=app==='Customer';const roleSelect=`<select aria-label="Preview application" onchange="go(this.value)"><option value="C02" ${isCustomer?'selected':''}>Customer app</option><option value="W02" ${app==='Worker'?'selected':''}>Worker app</option><option value="A01" ${app==='Admin'?'selected':''}>Admin dashboard</option></select>`;

const brand=link('C02','<span class="brandmark">c</span>china<b>lowcost</b>.','brand');

return preview+top+navigation+mobile+`<div class="${isCustomer?'':'workspace'}">${sidebar}<main id="content" class="${isCustomer?'customer-main':'work-main'}"><div class="crumb">${link(isCustomer?'C02':app==='Worker'?'W02':'A01',app==='Admin'?'Admin':app+' app')} &nbsp;/&nbsp; ${esc(navLabel(page))}</div>${content}<div class="screen-meta">${page.ID} · ${esc(page.Screen)} · ${esc(page.Access)} · ${esc(page['Key states'])}</div>${footer}</main></div>`;
}
function render(){route=location.hash.slice(1)||'C02';const page=PAGES.find(p=>p.ID===route);if(!page){location.hash='C02';return;}let content=page.Application==='Customer'?customerPage(route):page.Application==='Worker'?workerPage(route):adminPage(route);if(scenario==='empty')content=heading(navLabel(page),'An empty-state preview for this page.')+`<div class="empty"><div class="symbol">◇</div><h2>Nothing here yet</h2><p>${page.Application==='Customer'?'Your saved items and activity will appear here. Explore the collection to begin.':'New records will appear when the relevant task or request is created.'}</p>${button('Restore sample records',"scenario='normal';render()")}</div>`;if(scenario==='error')content=heading(navLabel(page))+note('This is a simulated service error. Your current demo data is preserved.','error')+card('We couldn’t load this page',`<p>Please try again or contact support if the issue continues.</p>${button('Try again',"scenario='normal';render()")}`);if(scenario==='offline')content=note('Offline preview: viewing saved sample records. External actions will need a connection in the live application.','warn')+content;$('app').innerHTML=shell(content,page);document.title=navLabel(page)+' · ChinaLowCost';}

case 'C01':return `<div class="auth">${heading('Good finds start here.','Create your customer account or sign in to continue.')}${primaryForm('Sign in with your phone',field('phone','Phone number (sample only)','08000000000','tel','required pattern="[0-9+ ]{8,16}"')+note('Demo verification code: <strong>123456</strong>. No SMS will be sent.')+field('otp','Verification code','','text','required pattern="123456" inputmode="numeric" maxlength="6"')+'<p class="muted">Use sample details. This prototype does not authenticate real accounts.</p>',"toast('Demo phone verified. Welcome, Ada.');go('C02')",'Verify & continue')}${link('C02','Continue browsing without signing in →')}</div>`;

function checkoutSteps(step){return `<div class="flowsteps">${['Cart','Delivery','Review','Payment'].map((s,i)=>`<span class="${i<=step?'on':''}">${i+1}. ${s}</span>`).join('')}</div>`;}
function calculation(p,q){if(!validQty(p,q,'wholesale'))return note('Enter 10 or more units in multiples of 5.','warn');const r=rate(p,q,'wholesale');return row('Quantity',q+' units')+row('Unit rate',money(r))+row('Goods subtotal',money(q*r))+row('Sample delivery',money(8000))+'<hr class="divider">'+`<div class="amount">${money(q*r+8000)}</div><p class="muted">Retail-reference savings: ${money((p.retail-r)*q)}</p>`;}
function calculateWholesale(){const p=products.find(x=>x.name===$('calc-product').value);const q=Number($('calc-qty').value);if(!validQty(p,q,'wholesale')){$('calc-error').textContent='Use a whole quantity of 10–100,000 units in multiples of 5.';return;}state.selected=p.id;state.qty=q;state.mode='wholesale';persist();render();toast('Wholesale calculation updated.');}
function createQuote(){if(!validQty(picked(),state.qty,'wholesale')){toast('Choose a valid wholesale quantity first.');return;}const p=picked();state.quote={id:'Q-DEMO-001',sku:p.id,name:p.name,qty:state.qty,rate:rate(p,state.qty,'wholesale'),delivery:8000,issued:Date.now(),expires:Date.now()+86400000,version:1};state.quoteAccepted=false;persist();go('C09');}
function quotePage(){const q=state.quote;return heading('A clear plan for your next order.','Download, review and accept a versioned quotation.',link('C08','New quotation','button secondary'))+(!q?`<div class="empty"><div class="symbol">▤</div><h2>No quotations yet</h2><p>Use the wholesale calculator to create your first sample quotation.</p>${link('C08','Calculate wholesale','button')}</div>`:`<div class="split">${card('Quotation '+q.id,`${badge(Date.now()>q.expires?'Expired':state.quoteAccepted?'Accepted':'Issued',Date.now()>q.expires?'warn':'')}<p style="margin-top:17px">Version ${q.version} · valid until ${new Date(q.expires).toLocaleString('en-GB')}</p>${table(['Product','Units','Unit rate','Subtotal'],[[esc(q.name),q.qty,money(q.rate),money(q.qty*q.rate)]])}${note('Quotation does not reserve stock. Final availability and delivery confirmation are required.')}<div class="actions">${button('Download quotation PDF',"downloadDocument('quote')")}${button('Accept & add to cart','acceptQuote()','secondary',Date.now()>q.expires||state.quoteAccepted)}</div>`)}${card('Quotation total',row('Goods subtotal',money(q.qty*q.rate))+row('Sample delivery',money(q.delivery))+row('Tax','Not configured')+'<hr class="divider">'+`<div class="amount">${money(q.qty*q.rate+q.delivery)}</div><p class="muted">Version prices are frozen for this sample quotation.</p>${link('C10','View cart →')}`)}</div>`);}
function acceptQuote(){const q=state.quote;if(!q||Date.now()>q.expires){toast('This quote has expired. Create a new version.');return;}if(state.quoteAccepted){toast('This quote is already accepted. View its items in the cart.');go('C10');return;}state.selected=q.sku;state.mode='wholesale';state.qty=q.qty;state.cart=state.cart.filter(l=>!(l.sku===q.sku&&l.mode==='wholesale'));state.cart.push({sku:q.sku,qty:q.qty,mode:'wholesale'});state.quoteAccepted=true;persist();toast('Quote accepted in demo. Items added once. Stock is not reserved.');go('C10');}
function addCart(q,wholesale=false){const p=picked(),mode=wholesale?'wholesale':state.mode;if(!validQty(p,q,mode)){const error=$('quantity-error');if(error)error.textContent=mode==='wholesale'?'Wholesale quantity must be 10–100,000 in multiples of 5.':'Choose a whole quantity from 1–100,000.';toast('Please check the quantity and pack multiple.');return;}const existing=state.cart.find(l=>l.sku===p.id&&l.mode===mode);if(existing){if(existing.qty+q>100000){toast('Maximum demo quantity is 100,000 units per item.');return;}existing.qty+=q;}else state.cart.push({sku:p.id,qty:q,mode});persist();toast('Added to your sample cart.');go('C10');}
function saveAddress(){if($('address-area').value==='Outside pilot zone'){toast('This zone needs a staff delivery quotation.');return;}state.address={name:$('address-name').value,phone:$('address-phone').value,street:$('address-street').value,area:$('address-area').value};persist();go('C12');}
function simulatePayment(){if(!state.cart.length){toast('Add items before previewing payment.');return;}if(state.paid){toast('The demo order is already paid. Reset the sample workspace to start another payment.');go('C15');return;}state.orderSnapshot={...totals(),units:state.cart.reduce((n,l)=>n+l.qty,0),lines:state.cart.map(l=>({...l,unitPrice:rate(products.find(p=>p.id===l.sku),l.qty,l.mode)}))};state.paid=true;state.order=true;record('Simulated provider-verified payment');toast('Demo payment verified. No money was collected.');go('C15');}
function trackingPage(){return heading('Every step, in view.','CLC-DEMO-001 · sample multi-shipment tracking',link('C18','Contact support','button secondary'))+stats([['Order',state.order?'Confirmed demo':'Sample reference','Customer order'],['Payment',state.paid?'Paid':'Pending','Independent financial state'],['Shipment 1',state.delivery?'Delivered':state.dispatch?'Dispatched':'Preparing','30 units · illustrative split'],['Shipment 2','Awaiting pickup','25 units · illustrative split']])+`<div class="grid">${card('Shipment 1 · 30 desk fans',timeline([['Order received','Customer details and quantities recorded'],['Payment verification',state.paid?'Demo provider event verified':'Awaiting verified funds',!state.paid],['Supplier pickup',state.pickup?'Pickup recorded by worker':'Worker pickup pending',!state.pickup],['Dispatch',state.dispatch?'Handover recorded':'Awaiting packing and dispatch',!state.dispatch],['Delivery',state.delivery?'Demo delivery confirmed':'Delivery window to be confirmed',!state.delivery]])+note('This timeline reflects demo actions across worker and admin pages. Shipment quantities illustrate the original 55-unit fan order.'))}${card('Shipment 2 · 25 desk fans',badge('Supplier confirmation pending','warn')+'<p style="margin-top:18px">The second pickup has its own timeline. ChinaLowCost will contact the customer if the delivery window changes.</p>'+row('Delivery window','Not yet confirmed')+row('Latest update','Supplier preparing remaining units')+note('No live courier map or location is connected.'))}</div>`;}
function chat(title,kind){return card(title,`<div class="message"><strong>ChinaLowCost team</strong><br>Welcome! How can we help with your products or order?<small>Sample conversation</small></div>${state.messages.filter(m=>m.kind===kind).map(m=>`<div class="message mine">${esc(m.text)}<small>Demo message · saved locally</small></div>`).join('')}<form onsubmit="event.preventDefault();sendMessage('${kind}')"><label for="message-input">Your message (sample information only)</label><textarea id="message-input" required maxlength="1000" placeholder="Ask about availability or your quotation"></textarea><div class="form-actions"><button type="submit">Send demo message</button></div></form>`);}
function sendMessage(kind){const text=$('message-input').value.trim();if(!text)return;state.messages.push({kind,text});persist();render();toast('Saved locally. No external message was sent.');}
function chooseImage(input){const file=input.files?.[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10485760){input.value='';toast('Choose a JPG, PNG or WebP image under 10 MB.');return;}if(localImage)URL.revokeObjectURL(localImage);localImage=URL.createObjectURL(file);imageName=file.name;render();toast('Image loaded locally for the preview.');}
function playStory(){videoFrame=(videoFrame+1)%4;const lines=['Product story · introductory view','Frame 1 · front view and finish','Frame 2 · controls and packaging','Frame 3 · check the catalog for current prices'];$('video-caption').textContent=lines[videoFrame];$('video-progress').style.width=(videoFrame*33)+'%';}
function workerPage(id){const titles=workerNames;const intro=heading(titles[id],'Assigned fieldwork · sample staff member Chidi · demo permissions');const taskRows=[['VIS-014','Catalog visit','Example Lagos Trading',badge(state.consent?'Consent recorded':'Consent needed','warn'),link('W03','Open visit ↗')],['PU-021','Supplier pickup','PO-DEMO-001',badge(state.pickup?'Collected':'Ready for pickup'),link('W08','Open pickup ↗')],['DEL-008','Customer delivery','CLC-DEMO-001',badge(state.delivery?'Delivered':'Pending dispatch','warn'),link('W11','Open delivery ↗')]];switch(id){
case 'W01':return intro+`<div class="auth">${card('Staff activation',row('Sample account','Chidi · catalog/field worker')+row('Access status',badge(state.staffStatus,state.staffStatus==='Active'?'':'warn'))+note('This prototype lets you inspect all screens. Production access must be restricted by approved role and task assignment.')+button('Preview staff sign-in',"toast(state.staffStatus==='Active'?'Demo staff session active.':'Staff activation is pending manager approval.');go('W02')")+`<div class="form-actions">${link('A02','Review staff activation in admin →')}</div>`)}</div>`;

case 'W04':return intro+`<div class="split">${card('Photos & product clips',!state.consent?note('Capture is blocked until supplier permission is recorded. '+link('W03','Record consent →'),'warn'):`<div class="dropzone"><div class="symbol">▧</div><h3>Capture the product, packaging and variants</h3><label for="catalog-photo">Choose product image</label><input id="catalog-photo" type="file" accept="image/jpeg,image/png,image/webp" onchange="chooseImage(this)">${localImage?`<img class="image-preview" src="${esc(localImage)}" alt="Selected catalog photo">`:''}<label for="catalog-video">Choose product video (local preview)</label><input id="catalog-video" type="file" accept="video/mp4,video/webm" onchange="uploadedVideo=!!this.files.length;toast('Video selection noted locally. No video is uploaded.')"></div><div class="form-actions">${link('W05','Review AI draft','button')}${link('W06','Enter details manually','button secondary')}</div>`)}${card('Capture checklist',timeline([['Product front & back','Keep labeling readable.'],['Variants & packaging','Show unit, pack and any included accessories.'],['Permissions & claims','Do not infer safety certification or performance.']])+note('File selection stays on your device. AI extraction is demonstrated with sample suggestions.'))}</div>`;

function pricingRows(t){return row('Goods subtotal',money(t.goods))+(t.wholesaleSavings>0?row('Wholesale tier savings',money(t.wholesaleSavings)+' already reflected'):'')+row('Product promo discount',t.goodsDiscount?'-'+money(t.goodsDiscount):'—')+row('Transport · '+esc(destination()),t.delivery===null?badge('Staff quote required','warn'):money(t.delivery))+(t.delivery!==null?`<small>Base ${money(t.transport.base)} + weight surcharge ${money(t.transport.surcharge)} · ${t.transport.chargeableKg} kg chargeable</small>`:'')+row('Transport promo discount',t.shippingDiscount?'-'+money(t.shippingDiscount):'—')+row('Tax','Not configured in demo')+'<hr class="divider">'+row(t.total===null?'Goods after product discount':'Estimated total',`<span class="amount">${money(t.total===null?t.netGoods:t.total)}</span>`)+(t.total===null?note('Transportation is not included. Staff must provide and confirm a delivery quotation before payment.','warn'):note('Illustrative transport estimate, not a courier tariff. Staff confirms actual packing, route and final charges.'))+(state.promoCode&&!t.promo.valid?note(esc(t.promo.message)+' Remove or change the code to continue.','warn'):'');}
orderSummary=()=>pricingRows(totals());

function bindLocation(prefix){$(prefix+'-state').onchange=()=>{const towns=NG_TOWNS[$(prefix+'-state').value]||[];$(prefix+'-town').innerHTML=[...towns,'Other town / area'].map(t=>`<option>${esc(t)}</option>`).join('');$(prefix+'-other-wrap').hidden=true;$(prefix+'-other').value='';};$(prefix+'-town').onchange=()=>{$(prefix+'-other-wrap').hidden=$(prefix+'-town').value!=='Other town / area';};}
function readLocation(prefix){const region=$(prefix+'-state').value;const town=$(prefix+'-town').value==='Other town / area'?$(prefix+'-other').value.trim():$(prefix+'-town').value;if(!NG_TOWNS[region]||!town){toast('Choose a Nigerian state and enter a town / area.');return null;}return {state:region,town,area:town};}

calculation=(p,q)=>{if(!validQty(p,q,'wholesale'))return oldCalculation(p,q);const t=priceLines([{sku:p.id,qty:q,mode:'wholesale'}]);return row('Quantity',q+' units')+row('Wholesale unit rate',money(rate(p,q,'wholesale')))+pricingRows(t);};

function alternativePayments(){const t=totals(),blocked=!state.cart.length||t.delivery===null||!t.promo.valid;return heading('Bank transfer & pay on delivery','Both methods use the location-aware total. Unquoted transportation cannot be treated as free delivery.')+`<div class="grid">${primaryForm('Report a sample bank transfer',row('Amount due',t.total===null?'Transportation quotation required':money(t.total))+note('No real bank account is provided. Finance must verify actual funds in production.')+field('transfer-reference','Sample reference','DEMO-TRANSFER-001','text','required'),"reportCommerceTransfer()",'Save reference for verification')}${card('Pay on delivery',row('Destination',esc(destination()))+row('Amount due',t.total===null?'Transportation quotation required':money(t.total))+badge('Eligibility approval required','warn')+note('Zone eligibility, exposure and cash-reconciliation controls apply. A request is not approval.')+button('Request COD review',"record('Location-aware sample COD review requested');toast('Demo request queued. No COD approval granted.')",'',blocked)+`<div class="form-actions">${link('C13','Back to payment options','button secondary')}</div>`)}</div>`;}

simulatePayment=()=>{const t=totals();if(t.delivery===null||!t.promo.valid){toast('Payment blocked: transportation or promotion needs confirmation.');return;}const wasPaid=state.paid;oldSimulatePayment();if(!wasPaid&&state.paid){state.orderSnapshot.address={...state.address};state.orderSnapshot.promoCode=state.promoCode;if(t.promo.rule){const rule=state.promoRules.find(p=>p.code===state.promoCode);rule.uses++;}persist();}};
createQuote=()=>{if(!validQty(picked(),state.qty,'wholesale')){toast('Choose a valid wholesale quantity.');return;}const p=picked(),lines=[{sku:p.id,qty:state.qty,mode:'wholesale'}],t=priceLines(lines);if(!t.promo.valid){toast(t.promo.message);return;}const version=(state.quote?.version||0)+1;state.quote={id:'Q-DEMO-001',sku:p.id,name:p.name,qty:state.qty,rate:rate(p,state.qty,'wholesale'),delivery:t.delivery,issued:Date.now(),expires:Date.now()+86400000,version,commerce:{...t,address:{...state.address},promoCode:state.promoCode}};state.quoteAccepted=false;persist();go('C09');};
function commerceQuotePage(){const q=state.quote;if(!q||!q.commerce)return quotePage()+(q?note('This older sample quote predates location pricing. Create a new version before checkout.','warn'):'');const c=q.commerce;return heading('Your quotation, with the full picture.','A frozen version of goods, destination, discounts and transportation.',link('C08','Create revised quotation','button secondary'))+`<div class="split">${card(q.id+' · version '+q.version,badge(Date.now()>q.expires?'Expired':state.quoteAccepted?'Accepted':c.delivery===null?'Transport quote required':'Issued estimate',c.delivery===null?'warn':'')+row('Destination',esc(c.address.town+', '+c.address.state))+row('Valid until',new Date(q.expires).toLocaleString('en-GB'))+table(['Product','Units','Unit rate','Subtotal'],[[esc(q.name),q.qty,money(q.rate),money(q.qty*q.rate)]])+row('Promo code',esc(c.promoCode||'None'))+note('This quotation is an estimate. A location, quantity, rate or promotion change requires a revised version.')+`<div class="actions">${button('Download quotation PDF',"downloadDocument('quote')")}${button('Accept & add to cart','acceptQuote()','secondary',Date.now()>q.expires||state.quoteAccepted||c.delivery===null)}</div>`)}${card('Frozen cost breakdown',quotePricingRows(c))}</div>`;}
function quotePricingRows(c){return row('Goods subtotal',money(c.goods))+row('Product discount','-'+money(c.goodsDiscount))+row('Transportation',c.delivery===null?'Not yet quoted':money(c.delivery))+row('Transport discount','-'+money(c.shippingDiscount))+row('Tax','Not configured')+'<hr class="divider">'+row(c.total===null?'Goods subtotal after discount':'Estimated total',`<span class="amount">${money(c.total===null?c.netGoods:c.total)}</span>`)+(c.total===null?note('Transportation excluded. Staff confirmation is required before payment.','warn'):'');}
acceptQuote=()=>{const q=state.quote;if(!q?.commerce){toast('Create a location-aware quotation before accepting.');return;}const c=q.commerce;if(c.delivery===null){toast('A staff transportation quotation is required first.');return;}if(c.address.state!==state.address.state||c.address.town!==state.address.town||c.promoCode!==state.promoCode){toast('Destination or promotion changed. Create a revised quotation.');return;}const current=priceLines([{sku:q.sku,qty:q.qty,mode:'wholesale'}]);if(!current.promo.valid||['total','delivery','goodsDiscount','shippingDiscount','goods'].some(k=>current[k]!==c[k])){toast('Rates or promo eligibility changed. Create a revised quotation.');return;}oldAcceptQuote();};
function promotionsCustomer(){const active=state.promoRules.filter(p=>p.active&&Date.now()>=p.start&&Date.now()<=p.end);return heading('More value for your next order.','Sample offers with clear eligibility, limits and expiry.')+`<div class="grid three">${active.map(p=>card(p.name,`<div class="promo-code">${esc(p.code)}</div>${badge(p.mode==='all'?'Retail + wholesale':p.mode)}<p style="margin-top:15px">${p.type==='shipping'?money(p.value)+' off transportation':p.type==='percent'?p.value+'% off eligible goods':money(p.value)+' off eligible goods'}</p>${row('Minimum eligible goods',money(p.min))}${row('Maximum discount',money(p.cap))}${row('Valid until',new Date(p.end).toLocaleDateString('en-GB'))}<p class="muted">One promo per order. ${p.mode==='wholesale'?'Stacks with published quantity tiers.':'Product eligibility is checked at checkout.'}</p>${button('Use this code',`state.promoCode='${p.code}';persist();toast('Code selected. Eligibility is checked against your cart.');go('C10')`,'secondary')}`)).join('')}</div>`+note('These are demonstration promotions, not real offers. Discounts do not turn an unquoted route into free delivery.')+links([['C08','Calculate a wholesale order'],['C03','Shop retail finds']]);}

function savePromotion(){const code=$('new-promo-code').value.trim().toUpperCase(),typeName=$('new-promo-type').value,type=typeName==='Percentage on goods'?'percent':typeName==='Transportation discount'?'shipping':'fixed',value=Number($('new-promo-value').value);if(state.promoRules.some(p=>p.code===code)){toast('This promo code already exists. Choose another code.');return;}if(type==='percent'&&value>100){toast('Percentage discounts cannot exceed 100%.');return;}const end=Date.parse($('new-promo-end').value+'T23:59:59Z');if(end<Date.now()){toast('Choose an expiry date in the future.');return;}state.promoRules.push({code,name:$('new-promo-name').value,type,value,min:Number($('new-promo-min').value),cap:Number($('new-promo-cap').value),mode:$('new-promo-mode').value,active:true,start:Date.now(),end,limit:Number($('new-promo-limit').value),uses:0});record('Demo promotion created: '+code);toast('Sample promo saved. Live publication would require approval.');render();}

function saveRate(){const location=readLocation('rate');if(!location)return;const entry={region:location.state,town:location.town,base:Number($('rate-base').value),stepFee:Number($('rate-step').value),includedKg:5,stepKg:5,eta:$('rate-eta').value,active:true};const index=state.deliveryRates.findIndex(r=>r.region===entry.region&&r.town.toLowerCase()===entry.town.toLowerCase());if(index<0)state.deliveryRates.push(entry);else state.deliveryRates[index]=entry;record('Demo transport rate saved: '+entry.region+' / '+entry.town);toast('Sample rate saved. Recalculate quotations after any rate change.');render();}

let navigationSequence=0;
const navigationEntries=[];
let navigationCursor=0;

function currentNavigationRoute(){return location.hash.slice(1)||'C02';}
function stampNavigationEntry(){const entry={key:'clc-'+Date.now()+'-'+(++navigationSequence),route:currentNavigationRoute()};try{if(typeof history!=='undefined')history.replaceState({...history.state,clcNavigationKey:entry.key},'');}catch{}return entry;}
navigationEntries.push(stampNavigationEntry());
function navigationHome(){const page=PAGES.find(p=>p.ID===currentNavigationRoute());return page?.Application==='Worker'?'W02':page?.Application==='Admin'?'A01':'C02';}
function goBack(){if(navigationCursor>0&&typeof history!=='undefined'){history.back();return;}const home=navigationHome();if(currentNavigationRoute()!==home)go(home);}
function trackNavigation(){const next=currentNavigationRoute();let key;try{key=typeof history!=='undefined'?history.state?.clcNavigationKey:null;}catch{}const existing=navigationEntries.findIndex(entry=>entry.key===key&&entry.route===next);if(existing>=0)navigationCursor=existing;else{navigationEntries.splice(navigationCursor+1);navigationEntries.push(stampNavigationEntry());navigationCursor=navigationEntries.length-1;}render();$('page-title')?.focus({preventScroll:true});}
shell=(content,page)=>{const disabled=navigationCursor===0&&currentNavigationRoute()===navigationHome();const control=`<div class="back-row"><button type="button" class="secondary back-button" onclick="goBack()" aria-label="Back to previous page" ${disabled?'disabled':''}><span aria-hidden="true">←</span> Back</button></div>`;return navigationShell(content,page).replace('<div class="crumb">',control+'<div class="crumb">');};

function opsNewDraft(sku='FAN-01',admin=false){if(!opsRequire('catalog',admin))return;const p=products.find(p=>p.id===sku)||products[0];const d={id:'D-'+Date.now()+'-'+state.ops.drafts.length,sku:p.id,title:p.name,category:p.category,subcategory:p.subcategory,style:p.style,quality:p.quality,condition:p.condition,variant:p.variant,moq:p.moq,pack:p.pack,threshold:p.volumeThreshold,retail:p.retail,bulk:p.bulk,volume:p.volume,cost:Math.round(p.volume*.75),quoteOnly:!!p.quoteOnly,specs:{...p.specs},rights:false,rightsRef:'',owner:admin?(state.staffActor||'Manager'):opsWorker().name,staffId:admin?null:opsWorker().id,status:'Draft',version:1,art:p.art,actualKg:ITEM_WEIGHTS[p.id]?.actual||0,volumeKg:ITEM_WEIGHTS[p.id]?.volume||0,createdAt:Date.now()};state.ops.drafts.push(d);state.ops.currentDraft=d.id;opsLog('Created catalog draft '+d.id,d.owner);go(admin?'A35':'W06');}
function opsEnsureDraft(admin=false){let d=opsDraft();if(!d){const p=picked();d={id:'D-SAMPLE-001',sku:p.id,title:p.name,category:p.category,subcategory:p.subcategory,style:p.style,quality:p.quality,condition:p.condition,variant:p.variant,moq:p.moq,pack:p.pack,threshold:p.volumeThreshold,retail:p.retail,bulk:p.bulk,volume:p.volume,cost:Math.round(p.volume*.75),quoteOnly:!!p.quoteOnly,specs:{...p.specs},rights:false,rightsRef:'',owner:admin?(state.staffActor||'Manager'):opsWorker().name,staffId:admin?null:opsWorker().id,status:'Draft',version:1,art:p.art,actualKg:ITEM_WEIGHTS[p.id]?.actual||0,volumeKg:ITEM_WEIGHTS[p.id]?.volume||0,createdAt:Date.now()};state.ops.drafts.push(d);state.ops.currentDraft=d.id;}return d;}
function opsDraftMedia(d){return state.ops.media.filter(m=>m.draftId===d.id);}
function opsMediaPanel(admin=false){const d=opsEnsureDraft(admin),media=opsDraftMedia(d);return card('Collect product photos & video',row('Draft',esc(d.id+' · '+d.title))+`<label class="check"><input id="ops-media-rights" type="checkbox" ${d.rights?'checked':''}> Supplier permission or content rights are recorded.</label>${field('ops-rights-ref','Permission / agreement reference',d.rightsRef,'text','placeholder="Visit consent or agreement reference"')}<label for="ops-files">Choose multiple product photos or videos</label><input id="ops-files" type="file" multiple accept="image/jpeg,image/png,image/webp,video/mp4,video/webm" onchange="opsUpload(this,${admin})"><p class="muted">Up to 8 images + 2 videos per draft. Images ≤10 MB; video ≤100 MB. File previews remain in this browser session.</p><div class="actions">${button('Use sample illustration',`opsSampleAsset(${admin})`,'secondary')}${link('W06','Edit full product draft','button ghost')}</div><div class="ops-media-grid">${media.map((m,i)=>`<article>${opsAssetPreview(m)}<strong>${esc(m.name)}</strong><small>${m.kind} · ${m.primary?'Primary image':m.status} ${opsAssets.has(m.id)?'':'· reattach file'}</small><div class="actions">${m.kind==='image'?button('Make primary',`opsMakePrimary('${m.id}')`,'ghost'):''}${button('Remove',`opsRemoveAsset('${m.id}')`,'ghost')}</div></article>`).join('')}</div>${!media.length?note('Capture front, back, packaging, labels and key details. Add actual supplier media or an explicitly illustrative sample.'):''}${note('Images do not publish automatically. A different reviewer checks rights, specifications, quality claims and prices.')}`);}
function opsAssetPreview(m){const a=opsAssets.get(m.id);if(!a)return '<div class="ops-asset-missing">▧<small>Reattach local file</small></div>';return m.kind==='video'?`<video controls preload="metadata" src="${esc(a.url)}" aria-label="${esc(m.name)}"></video>`:`<img src="${esc(a.url)}" alt="${esc(m.name)}">`;}
function opsUpload(input,admin=false){if(!opsRequire('catalog',admin)){input.value='';return;}const d=opsEnsureDraft(admin);if(!$('ops-media-rights').checked||!$('ops-rights-ref').value.trim()){input.value='';toast('Record content permission and its reference before adding media.');return;}d.rights=true;d.rightsRef=$('ops-rights-ref').value.trim();let accepted=0;const issues=[];for(const f of Array.from(input.files||[])){const kind=f.type.startsWith('image/')?'image':f.type.startsWith('video/')?'video':null;if(!['image/jpeg','image/png','image/webp','video/mp4','video/webm'].includes(f.type)||f.size>(kind==='image'?10485760:104857600)){issues.push(f.name+': unsupported type or size');continue;}const current=opsDraftMedia(d);const fingerprint=[f.name,f.size,f.lastModified].join(':');const existing=current.find(m=>m.fingerprint===fingerprint);if(existing){if(!opsAssets.has(existing.id)){opsAssets.set(existing.id,{url:URL.createObjectURL(f),blob:f});accepted++;}continue;}if(current.filter(m=>m.kind===kind).length>=(kind==='image'?8:2)){issues.push('Draft media limit reached');continue;}const id='M-'+Date.now()+'-'+Math.random().toString(16).slice(2,7);const url=URL.createObjectURL(f);opsAssets.set(id,{url,blob:f});state.ops.media.push({id,draftId:d.id,sku:d.sku,kind,name:f.name,fingerprint,primary:kind==='image'&&!current.some(m=>m.kind==='image'),rightsRef:d.rightsRef,status:'Draft',owner:d.owner,addedAt:Date.now()});accepted++;}d.status='Draft';opsLog('Collected '+accepted+' local media files for '+d.id,d.owner);render();toast(accepted+' file(s) added.'+(issues.length?' '+issues.join('; '):''));}
function opsSampleAsset(admin=false){if(!opsRequire('catalog',admin))return;const d=opsEnsureDraft(admin);if(!$('ops-media-rights').checked||!$('ops-rights-ref').value.trim()){toast('Confirm content rights and a reference first.');return;}d.rights=true;d.rightsRef=$('ops-rights-ref').value.trim();if(opsDraftMedia(d).filter(m=>m.kind==='image').length>=8){toast('Maximum 8 images per draft.');return;}const p=products.find(p=>p.id===d.sku)||products.find(p=>p.category===d.category)||products[0];const id='M-SAMPLE-'+Date.now()+'-'+state.ops.media.length;opsAssets.set(id,{url:opsBaseSVG(p,opsDraftMedia(d).length%3),sample:true});state.ops.media.push({id,draftId:d.id,sku:d.sku,kind:'image',name:'Illustrative '+p.name,primary:!opsDraftMedia(d).some(m=>m.kind==='image'),rightsRef:d.rightsRef,status:'Draft',owner:d.owner,addedAt:Date.now()});opsLog('Added illustrative media for '+d.id,d.owner);render();}
function opsMakePrimary(id){if(Object.values(state.ops.published).some(p=>p.mediaIds.includes(id))){toast('Create a revised draft to change a published primary image.');return;}const m=state.ops.media.find(m=>m.id===id);state.ops.media.filter(x=>x.draftId===m.draftId&&x.kind==='image').forEach(x=>x.primary=x.id===id);persist();render();}
function opsRemoveAsset(id){const m=state.ops.media.find(m=>m.id===id);if(Object.values(state.ops.published).some(p=>p.mediaIds.includes(id))){toast('Published media is retained. Create a revised draft to replace it.');return;}const a=opsAssets.get(id);if(a?.blob)URL.revokeObjectURL(a.url);opsAssets.delete(id);state.ops.media=state.ops.media.filter(m=>m.id!==id);persist();render();}
function opsCatalogForm(admin=false){const d=opsEnsureDraft(admin);return primaryForm('Product, selling rules & specifications',`<div class="form-grid">${field('ops-title','Product title',d.title,'text','required')}${field('ops-sku','SKU',d.sku,'text','required pattern="[A-Za-z0-9_-]{3,30}"')}${select('ops-category','Department',CATEGORY_TREE.map(c=>c.name),d.category).replace('<select id="ops-category">','<select id="ops-category" onchange="opsChangeDraftCategory(this.value)">')}${select('ops-subcategory','Product type',CATEGORY_TREE.find(c=>c.name===d.category)?.children||[],d.subcategory)}${select('ops-style','Design / style',['Modern','Minimal','Classic','Sporty','Industrial','Practical','Rugged','Colorful'],d.style)}${select('ops-quality','Supplier-declared grade',['Economy','Standard','Premium'],d.quality)}${select('ops-condition','Condition',['New','Refurbished','Used'],d.condition)}${field('ops-variant','Variant / finish',d.variant,'text','required')}${field('ops-moq','Wholesale MOQ',d.moq,'number','required min="1" max="100000"')}${field('ops-pack','Pack multiple',d.pack,'number','required min="1" max="100000"')}${field('ops-threshold','Volume tier begins at',d.threshold,'number','required min="1" max="100000"')}${field('ops-weight','Actual unit weight kg',d.actualKg,'number','min="0" step="0.01"')}${field('ops-volume-weight','Carrier volumetric unit weight kg',d.volumeKg,'number','min="0" step="0.01"')}${field('ops-cost','Supplier cost NGN · private',d.cost,'number','required min="0"')}${field('ops-retail','Retail unit price NGN',d.retail,'number','required min="1"')}${field('ops-bulk','Wholesale first tier NGN',d.bulk,'number','required min="1"')}${field('ops-volume','Wholesale volume tier NGN',d.volume,'number','required min="1"')}</div><label class="check"><input id="ops-quoteonly" type="checkbox" ${d.quoteOnly?'checked':''}> Specialist quotation required; ordinary parcel checkout is disabled.</label><h3 style="margin-top:25px">Category specifications</h3><div class="form-grid">${Object.entries(d.specs).map(([key,value],i)=>field('ops-spec-'+i,key.replace(/([a-z])([A-Z])/g,'$1 $2'),value,'text','required maxlength="500"')).join('')}</div>${note('Grade, inspection and certification are separate. No certification can be inferred from a photo. Saving creates a draft; publication requires an independent review.')}`,`opsSaveCatalog(${admin},false)`,'Save catalog draft')+`<div class="actions">${button('Submit full draft for review',`opsSaveCatalog(${admin},true)`)}${link(admin?'A35':'W04','Collect multiple images','button secondary')}${link('W18','Draft library','button ghost')}</div>`;}
function opsReadDraftFields(d){const text=(id,fallback)=>$(id)?$(id).value:fallback;const n=(id,fallback)=>Number(text(id,fallback));return {...d,title:text('ops-title',d.title),sku:text('ops-sku',d.sku).toUpperCase(),category:text('ops-category',d.category),subcategory:text('ops-subcategory',d.subcategory),style:text('ops-style',d.style),quality:text('ops-quality',d.quality),condition:text('ops-condition',d.condition),variant:text('ops-variant',d.variant),moq:n('ops-moq',d.moq),pack:n('ops-pack',d.pack),threshold:n('ops-threshold',d.threshold),actualKg:n('ops-weight',d.actualKg),volumeKg:n('ops-volume-weight',d.volumeKg),cost:n('ops-cost',d.cost),retail:n('ops-retail',d.retail),bulk:n('ops-bulk',d.bulk),volume:n('ops-volume',d.volume),quoteOnly:$('ops-quoteonly')?$('ops-quoteonly').checked:d.quoteOnly,specs:Object.fromEntries(Object.keys(d.specs).map((key,i)=>[key,text('ops-spec-'+i,d.specs[key])]))};}
function opsChangeDraftCategory(category){const d=opsEnsureDraft();const current=opsReadDraftFields(d),template=products.find(p=>p.category===category);Object.assign(d,current,{category,subcategory:CATEGORY_TREE.find(c=>c.name===category).children[0],art:template?.art||d.art,quoteOnly:!!template?.quoteOnly,moq:template?.moq||d.moq,pack:template?.pack||d.pack,threshold:template?.volumeThreshold||d.threshold,specs:{...(template?.specs||{Material:'Supplier confirmation required',Dimensions:'Supplier confirmation required'})}});persist();render();}
function opsSaveCatalog(admin=false,submit=false){if(!opsRequire('catalog',admin))return;const d=opsEnsureDraft(admin),next=opsReadDraftFields(d);if(!next.title.trim()||!/^[A-Z0-9_-]{3,30}$/.test(next.sku)||![next.moq,next.pack,next.threshold].every(n=>Number.isInteger(n)&&n>0)||next.moq%next.pack!==0||next.threshold<next.moq||next.threshold%next.pack!==0||![next.cost,next.retail,next.bulk,next.volume].every(n=>Number.isFinite(n)&&n>=0)||next.retail<=0||next.bulk<=0||next.volume<=0||Object.values(next.specs).some(v=>!String(v).trim())){toast('Check required specifications, title, SKU, prices, MOQ, pack multiples and tier threshold.');return;}Object.assign(d,next);const media=opsDraftMedia(d);media.forEach(m=>m.sku=d.sku);if(submit&&(!d.rights||!d.rightsRef||!media.some(m=>m.kind==='image'&&opsAssets.has(m.id)))){persist();toast('Add at least one attached product image and recorded content permission before submitting.');return;}d.status=submit?'Pending review':'Draft';d.version++;state.draftSubmitted=submit||state.draftSubmitted;if(submit)state.catalogStatus='Pending review';opsLog((submit?'Submitted':'Saved')+' full catalog draft '+d.id,d.owner);render();toast(submit?'Draft submitted for independent review.':'Draft saved locally.');}
function opsReviewCatalog(id,approve){const d=state.ops.drafts.find(d=>d.id===id),reviewer=state.ops.reviewer;if(!['Manager','Catalog reviewer'].includes(reviewer)||reviewer===d.owner){toast('Self-approval blocked. Choose a different authorized reviewer.');return;}if(!approve){d.status='Correction requested';d.reviewNote=$('ops-review-note')?.value||'Further verification needed';opsLog('Requested corrections for '+id,reviewer);render();return;}if(d.status!=='Pending review'||!d.rights||!opsDraftMedia(d).some(m=>m.kind==='image'&&opsAssets.has(m.id))){toast('A pending submitted version, content rights and attached images are required.');return;}if(d.volume<d.cost||d.bulk<d.cost){toast('Supplier cost exceeds a selling tier. Correct the price or seek a separately approved margin exception.');return;}const product={id:d.sku,name:d.title,category:d.category,subcategory:d.subcategory,style:d.style,quality:d.quality,condition:d.condition,variant:d.variant,moq:d.moq,pack:d.pack,volumeThreshold:d.threshold,retail:d.retail,bulk:d.bulk,volume:d.volume,quoteOnly:d.quoteOnly,specs:{...d.specs},art:d.art,actualKg:d.actualKg,volumeKg:d.volumeKg,color:d.variant,inspection:'Sample review',material:'Supplier-declared',fitment:d.category==='Auto parts & accessories'?'Vehicle-specific':'Not applicable',tag:'Reviewed demo draft',gallery:['Product view','Dimensions & details','Packaging / alternate view']};if(!d.quoteOnly&&(!(d.actualKg>0)||!(d.volumeKg>0))){toast('Provide actual and carrier volumetric weight, or use a specialist transportation quotation.');return;}const mediaIds=opsDraftMedia(d).map(m=>m.id);state.ops.published[d.sku]={product,mediaIds,version:d.version,reviewer,at:Date.now()};d.status='Published';state.catalogStatus='Published';opsDraftMedia(d).forEach(m=>m.status='Approved');opsLog('Published catalog version '+d.version+' for '+d.sku,reviewer);render();toast('Published demo product and attached media now appear in the customer catalog.');}
function opsApplyPublished(){for(const [sku,baseline] of Object.entries(opsBaseline)){const p=products.find(p=>p.id===sku);if(p)Object.assign(p,JSON.parse(JSON.stringify(baseline)));}products.splice(0,products.length,...products.filter(p=>opsBaseline[p.id]||state.ops.published[p.id]));for(const [sku,pub] of Object.entries(state.ops.published)){let p=products.find(p=>p.id===sku);if(p)Object.assign(p,JSON.parse(JSON.stringify(pub.product)));else{p=JSON.parse(JSON.stringify(pub.product));products.push(p);}if(!p.quoteOnly)ITEM_WEIGHTS[sku]={actual:pub.product.actualKg,volume:pub.product.volumeKg};const attached=pub.mediaIds.map(id=>state.ops.media.find(m=>m.id===id)).filter(m=>m?.kind==='image'&&opsAssets.has(m.id)).sort((a,b)=>Number(b.primary)-Number(a.primary));p.gallery=[...attached.map((m,i)=>'Product photo '+(i+1)),...['Product view','Dimensions & details','Packaging / alternate view']];}}
productSVG=(p,index=0)=>{const pub=state.ops?.published[p.id];const attached=pub?pub.mediaIds.map(id=>state.ops.media.find(m=>m.id===id)).filter(m=>m?.kind==='image'&&opsAssets.has(m.id)).sort((a,b)=>Number(b.primary)-Number(a.primary)):[];if(index<attached.length)return opsAssets.get(attached[index].id).url;return opsBaseSVG(p,(index-attached.length)%3);};
function opsOrder(){const s=state.orderSnapshot;if(s)return {...s,address:s.address||state.address,lines:s.lines||state.cart,promoCode:s.promoCode||''};if(state.cart.length)return {...totals(),address:{...state.address},lines:state.cart.map(l=>({...l,unitPrice:rate(products.find(p=>p.id===l.sku),l.qty,l.mode)})),promoCode:state.promoCode};const lines=[{sku:'FAN-01',qty:55,mode:'wholesale',unitPrice:4000}];return {...priceLines(lines,''),address:{...state.address},lines,promoCode:''};}
function opsOrderSummary(o=opsOrder()){return row('Order','CLC-DEMO-001')+row('Customer',esc(o.address.name))+row('State / town',esc(o.address.town+', '+o.address.state))+row('Street / landmark',esc(o.address.street+' '+(o.address.landmark||'')))+row('Goods subtotal',money(o.goods))+row('Product discount','-'+money(o.goodsDiscount||0))+row('Transportation',o.delivery===null?'Staff quotation required':money(o.delivery))+row('Transport discount','-'+money(o.shippingDiscount||0))+row('Promo',esc(o.promoCode||'None'))+row('Order total',o.total===null?'Not final':money(o.total));}
function opsSyncOrder(){const o=opsOrder();state.ops.tasks=state.ops.tasks.filter(t=>!t.id.startsWith('ORDER-PU-'));o.lines.forEach((l,i)=>state.ops.tasks.push({id:'ORDER-PU-'+(i+1),type:'Supplier pickup',staffId:'ST-01',reference:'CLC-DEMO-001 / supplier allocation '+(i+1),sku:l.sku,qty:l.qty,region:'Lagos',town:'Ikeja',status:'Assigned',due:Date.now()+7200000}));const delivery=state.ops.tasks.find(t=>t.id==='DEL-008');Object.assign(delivery,{region:o.address.state,town:o.address.town,qty:o.lines.reduce((n,l)=>n+l.qty,0),sku:o.lines.map(l=>l.sku).join(' / ')});opsLog('Assigned current order pickups and destination to workers','Manager');render();toast('Current order synchronized to assigned worker tasks.');}
function opsShift(start){const w=opsWorker();if(w.status!=='Active'){toast('Staff activation is required.');return;}if(start&&!$('ops-track-consent').checked){toast('Confirm task-location sharing before starting the shift.');return;}w.shift=start;w.consentAt=start?Date.now():null;w.lastSeen=start?Date.now():w.lastSeen;if(!start)opsDevicePositions.delete(w.id);opsLog(start?'Started shift with location consent':'Ended shift; device location cleared');render();}
function opsCheckin(){const w=opsWorker();if(!w.shift||w.status!=='Active'){toast('Start an approved on-shift session first.');return;}const region=$('ops-check-state').value,town=$('ops-check-town').value;w.region=region;w.town=town;w.lastSeen=Date.now();state.ops.checkins.unshift({id:'CHK-'+Date.now(),staffId:w.id,region,town,at:w.lastSeen,note:$('ops-check-note').value,source:'Manual check-in'});opsLog('Task check-in at '+town+', '+region);render();toast('Check-in visible in admin worker tracking.');}
function opsDeviceCheckin(){const w=opsWorker();if(!w.shift||!w.consentAt){toast('An active shift and explicit sharing consent are required.');return;}if(typeof navigator==='undefined'||!navigator.geolocation){toast('Device location is unavailable. Use a manual check-in.');return;}navigator.geolocation.getCurrentPosition(position=>{if(!w.shift||w.status!=='Active'){toast('Shift ended. Device position discarded.');return;}opsDevicePositions.set(w.id,{lat:position.coords.latitude,lng:position.coords.longitude,accuracy:position.coords.accuracy,at:Date.now()});w.lastSeen=Date.now();opsLog('Worker explicitly shared device position locally');render();toast('Device position shared only within this browser session.');},()=>toast('Location access was denied or unavailable. Manual check-in is still available.'),{enableHighAccuracy:false,timeout:12000,maximumAge:0});}
function opsTrackingPage(admin=false){const workers=admin?state.ops.staff:[opsWorker()];return heading(admin?'Worker activity & tracking':'Your shift & task check-ins',admin?'Last known check-ins, task status and consent. No background tracking.':'Share location for assigned work only. You can end sharing at any time.')+(admin?card('Team location board',`<div class="ops-location-board" role="img" aria-label="Schematic worker activity board; not a geographical map">${workers.map((w,i)=>`<div style="left:${8+(i%3)*30}%;top:${18+Math.floor(i/3)*30}%"><span class="ops-pin">${esc(w.name[0])}</span><strong>${esc(w.name)}</strong><small>${esc(w.town)}, ${esc(w.region)}</small></div>`).join('')}</div><small>Illustrative placement only. This schematic is not a live street map.</small>`):card('Shift controls',row('Staff',esc(opsWorker().name))+row('Shift',badge(opsWorker().shift?'On shift':'Off shift',opsWorker().shift?'':'gray'))+`<label class="check"><input id="ops-track-consent" type="checkbox" ${opsWorker().shift?'checked':''}> Share task check-ins with the operations team during this shift.</label><div class="actions">${button('Start shift','opsShift(true)','',opsWorker().shift)}${button('End shift / stop sharing','opsShift(false)','secondary',!opsWorker().shift)}</div>`))+card('Last known status',table(['Worker / role','Availability','Last location','Updated','Current tasks'],workers.map(w=>[esc(w.name)+'<small>'+esc(w.role)+'</small>',badge(w.status!=='Active'?w.status:w.shift?'On shift':'Off shift',w.shift?'':'gray'),esc(w.town+', '+w.region)+(opsDevicePositions.has(w.id)?'<small>Device position shared locally</small>':''),opsTime(w.lastSeen)+(w.lastSeen&&Date.now()-w.lastSeen>900000?'<small>Stale · over 15 minutes</small>':''),state.ops.tasks.filter(t=>t.staffId===w.id&&t.status!=='Completed').length]))+note('Check-in towns are staff-entered. Device coordinates are shared only after a worker clicks the location button; they remain in memory and are cleared on shift end. No location is sent to an external map.'))+(admin?'':primaryForm('Manual task check-in',`<div class="form-grid">${select('ops-check-state','State / FCT',Object.keys(NG_TOWNS).sort(),opsWorker().region).replace('<select id="ops-check-state">','<select id="ops-check-state" onchange="$(\'ops-check-town\').innerHTML=NG_TOWNS[this.value].map(t=>\'<option>\'+esc(t)+\'</option>\').join(\'\')">')}${select('ops-check-town','Town / area',NG_TOWNS[opsWorker().region],opsWorker().town)}</div>${field('ops-check-note','Task update','Arrived at assigned stop','text','required')}`,"opsCheckin()",'Share manual check-in')+card('Optional device position',note('Your browser will ask for location permission. Use manual check-ins if you prefer.')+button('Share current device location','opsDeviceCheckin()','secondary')))+card('Recent check-ins',state.ops.checkins.filter(c=>admin||c.staffId===opsWorker().id).slice(0,12).map(c=>`<div class="audit-row"><strong>${esc(state.ops.staff.find(w=>w.id===c.staffId)?.name)} · ${esc(c.town+', '+c.region)}</strong><small>${opsTime(c.at)} · ${esc(c.source)} · ${esc(c.note)}</small></div>`).join('')||note('No check-ins recorded yet.'));
}

 jobsInit();const t=state.ops.tasks.find(t=>t.id===id);if(!t)return jobsFail('Task not found.');if(revision!==undefined&&revision!==t.revision)return jobsFail('This job changed. Reopen it before acting.');
 const worker=jobsActor(t),manager=jobsManager();const terminal=['Completed','Revoked'].includes(t.status);
 if(['accept','start','submit','issue'].includes(action)&&(!worker||terminal))return jobsFail('Only the active assigned worker can update an open job.');
 if(['approve','correction','revoke','reassign'].includes(action)&&!manager)return jobsFail('A signed-in Manager is required.');
 if(action==='accept'){if(t.status!=='Assigned')return jobsFail('Only an assigned job can be accepted.');t.status='Accepted';jobsRecord(t,'Accepted',worker);}
 else if(action==='start'){if(!['Accepted','Needs correction','Blocked'].includes(t.status))return jobsFail('Accept the job before starting it.');t.status='In progress';t.startedAt=Date.now();jobsRecord(t,'Started',worker);}
 else if(action==='issue'){if(!['Accepted','In progress','Needs correction'].includes(t.status)||!note.trim())return jobsFail('Enter the issue for an accepted or active job.');t.status='Blocked';t.issue=note.trim();jobsRecord(t,'Reported issue',worker,note.trim());}
 else if(action==='submit'){
 if(t.status!=='In progress')return jobsFail('Start the job before submitting work.');if(note.trim().length<10||!evidence.trim()||!Number.isInteger(Number(units))||Number(units)<1||Number(units)>t.qty)return jobsFail('Provide a work summary (10+ characters), evidence reference and valid completed units.');
 if(t.type==='Supplier pickup'&&!state.ops.receipts.some(r=>r.taskId===id))return jobsFail('Record the assigned goods receipt before submitting pickup work.');
 if(t.type==='Delivery'&&!t.deliveryVerified)return jobsFail('Verify dispatched delivery with the customer code before submission.');
 if(t.type==='Catalog entry'&&!state.ops.drafts.some(d=>d.staffId===t.staffId&&d.sku===t.sku&&['Pending review','Published','Approved'].includes(d.status)))return jobsFail('Submit a matching product draft for independent catalog review first.');
 const submission={id:'SUB-'+authRandom(8),workerId:worker.id,staffId:t.staffId,at:Date.now(),summary:note.trim(),evidence:evidence.trim(),units:Number(units),assignmentRevision:t.revision};t.submissions.unshift(submission);t.status='Submitted for review';t.submittedAt=submission.at;delete t.reviewedBy;jobsRecord(t,'Submitted for review',worker,submission.summary);
 }
 else if(action==='approve'||action==='correction'){
 if(t.status!=='Submitted for review')return jobsFail('Only submitted work can be reviewed.');if(action==='approve'&&t.type==='Packing'&&!state.ops.receipts.some(r=>r.sku===t.sku&&r.accepted>=t.qty&&state.ops.tasks.some(p=>p.id===r.taskId&&p.status==='Completed'&&p.reviewedBy)) )return jobsFail('Approve received goods before authorizing packing dispatch.');const sub=t.submissions[0];if(!sub)return jobsFail('A worker must submit fresh evidence before review.');if(sub.workerId===manager.id)return jobsFail('Independent review is required.');if(action==='correction'&&!note.trim())return jobsFail('Explain what the worker must correct.');
 t.status=action==='approve'?'Completed':'Needs correction';t.reviewNote=note.trim();t.reviewedBy=manager.id;t.reviewedAt=Date.now();sub.review={action,by:manager.id,at:t.reviewedAt,note:t.reviewNote};if(action==='approve'){t.completedAt=Date.now();if(t.type==='Delivery')state.delivery=true;if(t.type==='Packing')state.dispatch=true;if(t.type==='Supplier pickup'){const receipt=state.ops.receipts.find(r=>r.taskId===t.id);state.pickup=state.pickup||receipt?.accepted>0;state.inspection=state.inspection||receipt?.accepted>0;}if(t.type==='Return collection')state.returnCollected=true;}jobsRecord(t,action==='approve'?'Approved completion':'Requested correction',manager,note.trim());
 }
 else if(action==='revoke'){if(terminal)return jobsFail('This job is already closed.');if(!note.trim())return jobsFail('Give a reason for revocation.');t.status='Revoked';t.revokedAt=Date.now();jobsRecord(t,'Revoked assignment',manager,note.trim());}
 else if(action==='reassign'){
 if(terminal)return jobsFail('Create a follow-up job for closed work.');const w=state.ops.staff.find(w=>w.id===staffId&&w.status==='Active');if(!w||!(JOB_ROLES[w.role]||[]).includes(t.type)||staffId===t.staffId||!note.trim())return jobsFail('Choose another active worker with the correct role and give a reason.');const old=t.staffId;t.staffId=staffId;t.status='Assigned';delete t.deliveryVerified;delete t.reviewedBy;jobsRecord(t,'Reassigned',manager,old+' → '+staffId+' · '+note.trim());
 }else return jobsFail('Unknown action.');persist();return {ok:true};
}
function jobsAction(id,action,revision){const r=jobsTransition(id,action,{revision,note:$('job-note')?.value||'',evidence:$('job-evidence')?.value||'',units:$('job-units')?.value,staffId:$('job-reassign')?.value});if(r.ok){$('modal').close();render();toast('Job updated.');}}
function jobsOpen(id){jobsInit();const t=state.ops.tasks.find(t=>t.id===id);if(!t)return;const manager=route.startsWith('A')?jobsManager():null,worker=route.startsWith('W')?jobsActor(t):null;if(!manager&&!worker){toast('This job is outside your account access.');return;}state.ops.selectedTask=id;persist();const action=(text,a,cls='secondary')=>button(text,"jobsAction('"+id+"','"+a+"',"+t.revision+")",cls);let controls='';
 if(worker){if(t.status==='Assigned')controls+=action('Accept job','accept');if(['Accepted','Needs correction','Blocked'].includes(t.status))controls+=action('Start / resume work','start');if(t.status==='In progress')controls+=action('Submit for admin review','submit','');if(['Accepted','In progress','Needs correction'].includes(t.status))controls+=action('Report issue','issue');const target=opsTaskRoute(t.type);if(!['Revoked','Completed'].includes(t.status))controls+=link(target,'Open work tools','button secondary');}
 if(manager&&!['Revoked','Completed'].includes(t.status)){if(t.status==='Submitted for review')controls+=action('Approve completion','approve','')+action('Return for correction','correction');controls+=select('job-reassign','Reassign to worker',state.ops.staff.filter(w=>w.id!==t.staffId&&w.status==='Active'&&(JOB_ROLES[w.role]||[]).includes(t.type)).map(w=>w.id),'')+action('Reassign job','reassign')+action('Revoke job','revoke','danger');}
 openModal(t.id+' · '+t.type,row('Assigned worker',esc(state.ops.staff.find(w=>w.id===t.staffId)?.name||'Unassigned'))+row('Status',badge(t.status))+row('Reference / SKU',esc(t.reference+' / '+t.sku))+row('Location',esc(t.town+', '+t.region))+row('Due',new Date(t.due).toLocaleString('en-GB'))+(t.reviewNote?note('Review feedback: '+esc(t.reviewNote),'warn'):'')+field('job-note',manager?'Review / reassignment / revocation reason':'Work summary / issue','','text')+(worker?field('job-evidence','Evidence reference (receipt, media or report ID)','','text')+field('job-units','Completed units',t.qty,'number','min="1" max="'+t.qty+'"'):'')+'<div class="actions">'+controls+'</div>'+card('Submitted evidence',t.submissions.map(s=>row(opsTime(s.at),esc(s.summary)+'<small>'+esc(s.evidence)+' · '+s.units+' units · '+esc(s.review?.action||'Awaiting review')+'</small>')).join('')||note('No evidence submitted.'))+card('Job history',t.history.map(e=>row(esc(e.action),esc(e.name+' · '+e.details)+'<small>'+opsTime(e.at)+'</small>')).join('')||note('Initial assignment')));
}

/* WhatsApp click-to-chat configuration; dummy mode never creates an external link. */
const WA_DUMMY='2340000000000';
function waSettings(){if(!state.whatsapp)state.whatsapp={number:WA_DUMMY,mode:'Demo preview',enabled:true};return state.whatsapp;}
function waNormalize(number){return String(number).trim().replace(/[+\s()-]/g,'');}
function waValid(number){return /^[1-9][0-9]{7,14}$/.test(number)&&number!==WA_DUMMY&&!/^2340/.test(number);}
function waSaveValues({number,mode,enabled}){const user=authSession('admin');if(!route.startsWith('A')||user?.scope!=='Manager')return {ok:false,message:'A Manager must configure WhatsApp.'};number=waNormalize(number);if(!['Demo preview','Live chat link'].includes(mode))return {ok:false,message:'Choose a valid mode.'};if(mode==='Live chat link'&&!waValid(number))return {ok:false,message:'Enter an actual international business number before enabling live links.'};if(mode==='Demo preview'&&number!==WA_DUMMY&&!waValid(number))return {ok:false,message:'Use the dummy number or a valid international number.'};state.whatsapp={number,mode,enabled:!!enabled};authAudit('Updated WhatsApp click-to-chat configuration · '+mode,user);return {ok:true};}

function waChatData(kind='support'){const cfg=waSettings(),message=waMessage(kind);return {number:cfg.number,message,url:cfg.enabled&&cfg.mode==='Live chat link'&&waValid(cfg.number)?'https://wa.me/'+cfg.number+'?text='+encodeURIComponent(message):null,enabled:cfg.enabled};}

const enhAssign=opsAssignTask;opsAssignTask=()=>{const priority=$('enh-job-priority')?.value||'Normal',orderId=$('enh-job-order')?.value;const linked=enhInit().orders[orderId];if(linked&&['Supplier pickup','Inspection','Packing'].includes($('ops-task-type').value)&&!linked.snapshot.lines.some(l=>l.sku===$('ops-task-sku').value&&Number($('ops-task-qty').value)<=l.qty)){toast('Match the product and quantity to the selected order.');return;}const before=state.ops.tasks.length;enhAssign();if(state.ops.tasks.length>before){const t=state.ops.tasks.at(-1);t.priority=priority;const order=enhInit().orders[orderId];if(order){t.orderId=order.id;t.customerId=order.customerId;t.reference=order.id;}const u=authDatabase.users.find(u=>u.workerId===t.staffId);if(u)enhNotify(u.id,'New '+t.type+' job: '+t.id,'W02');persist();}};

function enhArchiveOrder(){const u=authSession('customer');if(!u||!state.orderSnapshot)return null;const e=enhInit();let id=state.orderSnapshot.id;if(!id){id='CLC-'+new Date().toISOString().slice(0,10).replaceAll('-','')+'-'+authRandom(4).toUpperCase();state.orderSnapshot.id=id;}if(!e.orders[id])e.orders[id]={id,customerId:u.id,at:Date.now(),snapshot:authCopy(state.orderSnapshot),shipment:{dispatched:false,delivered:false}};persist();return e.orders[id];}
const enhPayment=simulatePayment;simulatePayment=()=>{const paid=state.paid;enhPayment();if(!paid&&state.paid){const o=enhArchiveOrder();if(o)enhNotify(o.customerId,'Order '+o.id+' confirmed in the payment simulation.','C15');render();}};
function enhOrderList(){const u=authSession('customer'),orders=Object.values(enhInit().orders).filter(o=>o.customerId===u?.id);return heading('Your orders','Account-specific order history. Payments remain simulated.')+card('Orders',orders.map(o=>row(esc(o.id),money(o.snapshot.total)+' · '+(o.shipment?.delivered?'Delivered':o.shipment?.dispatched?'Dispatched':'Confirmed')+'<div class="actions">'+button('Reorder',"enhReorder('"+o.id+"')",'secondary')+button('Track',"enhTrack('"+o.id+"')",'ghost')+'</div>')).join('')||note('No orders placed with this account yet.'));}
function enhTrack(id){const o=enhInit().orders[id];if(!o||o.customerId!==authSession('customer')?.id)return;state.orderSnapshot=authCopy(o.snapshot);state.order=true;state.paid=true;state.dispatch=!!o.shipment?.dispatched;state.delivery=!!o.shipment?.delivered;persist();go('C16');}
function enhReorder(id){const o=enhInit().orders[id];if(!o||o.customerId!==authSession('customer')?.id)return;const lines=o.snapshot.lines||[];if(!lines.length||lines.some(l=>!products.some(p=>p.id===l.sku&&!p.quoteOnly))){toast('Some products require a new quotation or are unavailable. Contact support.');return;}openModal('Reorder with current prices?',note('This replaces your current cart. Prices, discounts, MOQ, stock and transportation must be reviewed again.')+button('Replace cart',"enhConfirmReorder('"+id+"')")+button('Cancel',"$('modal').close()",'secondary'));}
function enhConfirmReorder(id){const o=enhInit().orders[id];if(!o||o.customerId!==authSession('customer')?.id)return;state.cart=o.snapshot.lines.map(l=>({sku:l.sku,qty:l.qty,mode:l.mode}));state.order=false;state.paid=false;state.transfer=false;state.returnRequested=false;state.dispatch=false;state.delivery=false;state.orderSnapshot=null;state.quote=null;state.quoteAccepted=false;state.promoCode='';persist();$('modal').close();go('C10');}
function enhStaffOrder(){if(!route.startsWith('A')&&!route.startsWith('W'))return null;const e=enhInit(),role=route.startsWith('W')?'worker':'admin',u=authSession(role);const t=state.ops.tasks.find(t=>t.id===state.ops.selectedTask&&(role==='admin'||t.staffId===u?.workerId));return t?.orderId?e.orders[t.orderId]:role==='admin'?e.orders[e.selectedOrderId]:null;}
const enhOpsOrder=opsOrder;opsOrder=()=>{const o=enhStaffOrder();if(o)return {...authCopy(o.snapshot),id:o.id};if(route.startsWith('W'))return {id:'No order linked to this job',lines:[],address:{name:'Not available',state:'',town:'',street:'',landmark:''},goods:0,total:0,delivery:0};return enhOpsOrder();};
function enhSelectOrder(id){if(!jobsManager()||!enhInit().orders[id])return;enhInit().selectedOrderId=id;state.ops.selectedTask=null;authSwitchRoom(enhInit().orders[id].customerId);persist();render();}
opsSyncOrder=()=>{if(!jobsManager())return;const e=enhInit(),o=e.orders[e.selectedOrderId];if(!o){toast('Select an order before creating assignments.');return;}if(state.ops.tasks.some(t=>t.orderId===o.id)){toast('This order already has assignments. Manage existing jobs.');return;}const pickup=state.ops.staff.find(w=>w.status==='Active'&&(JOB_ROLES[w.role]||[]).includes('Supplier pickup')),delivery=state.ops.staff.find(w=>w.status==='Active'&&(JOB_ROLES[w.role]||[]).includes('Delivery'));if(!pickup||!delivery){toast('Activate compatible pickup and delivery workers first.');return;}for(const [i,l] of o.snapshot.lines.entries()){state.ops.tasks.push({id:'ORDER-PU-'+authRandom(8),orderId:o.id,customerId:o.customerId,allocationId:o.id+'-'+i,type:'Supplier pickup',staffId:pickup.id,reference:o.id,sku:l.sku,qty:l.qty,region:o.snapshot.address.state,town:o.snapshot.address.town,status:'Assigned',due:Date.now()+7200000});}state.ops.tasks.push({id:'ORDER-DEL-'+authRandom(8),orderId:o.id,customerId:o.customerId,type:'Delivery',staffId:delivery.id,reference:o.id,sku:o.snapshot.lines.map(l=>l.sku).join(' / '),qty:o.snapshot.units,region:o.snapshot.address.state,town:o.snapshot.address.town,status:'Assigned',due:Date.now()+14400000});jobsInit();for(const t of state.ops.tasks.filter(t=>t.orderId===o.id)){const u=authDatabase.users.find(u=>u.workerId===t.staffId);if(u)enhNotify(u.id,'New order job '+t.id,'W02');}persist();render();};
function enhSuppliersPanel(){return primaryForm('Add supplier record',field('enh-supplier-name','Trading name','','text','required maxlength="120"')+field('enh-supplier-contact','Business contact','','text','required maxlength="120"')+field('enh-supplier-town','Premises / town','','text','required maxlength="200"')+field('enh-supplier-agreement','Agreement / verification reference','','text','maxlength="120"'),'enhSupplierSave()','Save supplier')+card('Saved supplier records',table(['Supplier','Contact','Premises','Verification',''],enhInit().suppliers.map(s=>[esc(s.name),esc(s.contact),esc(s.town),badge(s.status),button(s.status==='Verified'?'Put on hold':'Mark verified',"enhSupplierStatus('"+s.id+"')",'secondary')])));}
function enhSupplierSave(){if(!jobsManager())return;const name=$('enh-supplier-name').value.trim(),contact=$('enh-supplier-contact').value.trim(),town=$('enh-supplier-town').value.trim(),agreement=$('enh-supplier-agreement').value.trim();if(!name||!contact||!town){toast('Complete name, contact and premises.');return;}enhInit().suppliers.push({id:'SUP-'+authRandom(8),name,contact,town,agreement,status:'Pending verification'});authAudit('Created supplier record '+name,authSession('admin'));render();}
function enhSupplierStatus(id){if(!jobsManager())return;const s=enhInit().suppliers.find(s=>s.id===id);if(!s)return;if(s.status!=='Verified'&&!s.agreement){toast('Record verification / agreement evidence before verification.');return;}s.status=s.status==='Verified'?'On hold':'Verified';authAudit('Supplier '+s.id+' '+s.status,authSession('admin'));render();}

function enhRoomForPage(role,u){if(!u)return 'guest';const e=enhInit();if(role==='admin')return e.orders[e.selectedOrderId]?.customerId||'guest';const t=state.ops.tasks.find(t=>t.id===state.ops.selectedTask&&t.staffId===u.workerId);return t?.customerId||'guest';}
const enhSummaryBase=opsOrderSummary;opsOrderSummary=(o=opsOrder())=>enhSummaryBase(o).replace('CLC-DEMO-001',esc(o.id||'Sample order'));
const enhBoundTransition=jobsTransition;jobsTransition=(id,action,data={})=>{const t=state.ops.tasks.find(t=>t.id===id),o=t?.orderId&&enhInit().orders[t.orderId];if(o&&action==='approve'&&t.type==='Packing'&&!state.ops.receipts.some(r=>r.sku===t.sku&&r.accepted>=t.qty&&state.ops.tasks.some(p=>p.id===r.taskId&&p.orderId===t.orderId&&p.status==='Completed'&&p.reviewedBy)))return jobsFail('This order needs its own approved goods receipt before dispatch.');const r=enhBoundTransition(id,action,data);if(r.ok&&action==='approve'&&o){const current=state.orderSnapshot?.id;if(current!==o.id){state.dispatch=!!enhInit().orders[current]?.shipment?.dispatched;state.delivery=!!enhInit().orders[current]?.shipment?.delivered;}persist();}return r;};
const enhDeliveryConfirm=opsConfirmDelivery;opsConfirmDelivery=()=>{const t=opsCurrentTask('Delivery');if(t?.orderId){const o=enhInit().orders[t.orderId];if(!o?.shipment?.dispatched){toast('This order has not been dispatched.');return;}state.dispatch=true;}enhDeliveryConfirm();};
function enhSupplierEvidence(id){if(!jobsManager())return;const s=enhInit().suppliers.find(s=>s.id===id);if(!s)return;openModal('Supplier verification record',field('enh-supplier-proof','Agreement / visit evidence reference',s.agreement,'text','required')+button('Save evidence',"enhSupplierEvidenceSave('"+id+"')"));}
function enhSupplierEvidenceSave(id){if(!jobsManager())return;const s=enhInit().suppliers.find(s=>s.id===id),ref=$('enh-supplier-proof').value.trim();if(!s||!ref)return;s.agreement=ref;persist();$('modal').close();render();}
const enhSupplierPanelBase=enhSuppliersPanel;enhSuppliersPanel=()=>enhSupplierPanelBase()+card('Verification evidence',enhInit().suppliers.map(s=>row(esc(s.name),button('Record agreement / visit evidence',"enhSupplierEvidence('"+s.id+"')",'secondary'))).join('')||note('Save a supplier before recording evidence.'));
function enhParseCSV(text){if(text.length>500000)throw Error('Use a CSV under 500 KB.');const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else if(!quoted&&cell.length)throw Error('Invalid CSV quoting.');else quoted=!quoted;}else if(!quoted&&(c===','||c==='\n')){row.push(cell.replace(/\r$/,''));cell='';if(c==='\n'){if(row.some(v=>v.trim()))rows.push(row);row=[];}}else cell+=c;}if(quoted)throw Error('Unclosed CSV quote.');row.push(cell.replace(/\r$/,''));if(row.some(v=>v.trim()))rows.push(row);return rows;}
let enhImportPreview=null;
function enhImportValidate(text){const rows=enhParseCSV(text),header=rows.shift()||[];const fields=['template_sku','sku','title','retail','bulk','volume','moq','pack','threshold'];if(header.join(',')!==fields.join(','))throw Error('Use the exact template header.');if(!rows.length||rows.length>200)throw Error('Import between 1 and 200 products.');const seen=new Set();return rows.map((r,i)=>{if(r.length!==fields.length)throw Error('Row '+(i+2)+': incorrect columns.');const d=Object.fromEntries(fields.map((k,j)=>[k,r[j].trim()]));const p=products.find(p=>p.id===d.template_sku);if(!p||!/^[A-Z0-9_-]{3,30}$/.test(d.sku)||!d.title||seen.has(d.sku)||products.some(p=>p.id===d.sku)||state.ops.drafts.some(x=>x.sku===d.sku))throw Error('Row '+(i+2)+': invalid template, duplicate SKU or missing title.');seen.add(d.sku);for(const k of fields.slice(3))d[k]=Number(d[k]);if(![d.retail,d.bulk,d.volume].every(n=>Number.isFinite(n)&&n>0)||d.retail<d.bulk||d.bulk<d.volume||![d.moq,d.pack,d.threshold].every(n=>Number.isInteger(n)&&n>0&&n<=100000)||d.moq%d.pack||d.threshold%d.pack||d.threshold<d.moq)throw Error('Row '+(i+2)+': invalid prices, MOQ or pack rules.');return d;});}
function enhImportPreviewForm(){if(!jobsManager())return;try{enhImportPreview=enhImportValidate($('enh-import-text').value);$('enh-import-status').textContent=enhImportPreview.length+' valid rows. Review the preview, then create drafts.';$('enh-import-preview').innerHTML=table(['SKU','Title','Retail','Wholesale','Volume'],enhImportPreview.map(r=>[esc(r.sku),esc(r.title),money(r.retail),money(r.bulk),money(r.volume)]));}catch(e){enhImportPreview=null;$('enh-import-status').textContent=e.message;$('enh-import-preview').innerHTML='';}}
async function enhImportFile(input){const f=input.files?.[0];if(!f)return;if(f.size>500000){$('enh-import-status').textContent='Use a file under 500 KB.';return;}$('enh-import-text').value=await f.text();enhImportPreview=null;$('enh-import-preview').innerHTML='';}
function enhImportCommit(){const u=jobsManager();if(!u||!enhImportPreview){toast('Validate a CSV first.');return;}let rows;try{rows=enhImportValidate($('enh-import-text').value);}catch(e){toast(e.message);return;}if(JSON.stringify(rows)!==JSON.stringify(enhImportPreview)){toast('CSV changed. Preview it again.');return;}for(const r of rows){const p=products.find(p=>p.id===r.template_sku);state.ops.drafts.push({id:'IMPORT-'+authRandom(8),sku:r.sku,title:r.title,category:p.category,subcategory:p.subcategory,style:p.style,quality:p.quality,condition:p.condition,variant:p.variant,moq:r.moq,pack:r.pack,threshold:r.threshold,retail:r.retail,bulk:r.bulk,volume:r.volume,cost:0,quoteOnly:!!p.quoteOnly,specs:{...p.specs},rights:false,rightsRef:'',owner:u.name+' · '+u.id,requestedByUserId:u.id,staffId:null,status:'Draft',version:1,art:p.art,actualKg:0,volumeKg:0,createdAt:Date.now()});}authAudit('Imported '+rows.length+' catalog drafts',u);enhImportPreview=null;render();toast('Drafts created. Verify specifications, costs, weights, images and permission before review.');}
function enhImportPanel(){if(!jobsManager())return '';return card('Bulk catalog import · CSV',note('Create up to 200 new draft SKUs using an existing product as a category template. Nothing is published. Specifications, supplier costs, weights and media must be verified individually.')+'<label for="enh-import-file">Choose CSV</label><input id="enh-import-file" type="file" accept=".csv,text/csv" onchange="enhImportFile(this)"><label for="enh-import-text">CSV content</label><textarea id="enh-import-text" rows="5">template_sku,sku,title,retail,bulk,volume,moq,pack,threshold\nFAN-01,NEW-FAN-001,New fan draft,6000,5000,4500,10,5,50</textarea><p id="enh-import-status" role="status"></p><div id="enh-import-preview"></div><div class="actions">'+button('Validate and preview','enhImportPreviewForm()','secondary')+button('Create reviewed-input drafts','enhImportCommit()')+'</div>');}
const enhBulkAdmin=adminPage;adminPage=id=>enhBulkAdmin(id)+(id==='A07'?enhImportPanel():'');


const enhRenderBase=render;render=()=>{const id=location.hash.slice(1);if(authBooted&&id.startsWith('C')&&authSession('customer')){const user=authSession('customer');const room=state.authActiveCustomerId===user.id?state:state.authCustomerSpaces?.[user.id];const current=room?.orderSnapshot?.id;const order=current&&enhInit().orders[current];state.dispatch=order?.customerId===user.id&&!!order.shipment?.dispatched;state.delivery=order?.customerId===user.id&&!!order.shipment?.delivered;}enhRenderBase();};


const enhEvidenceFiles=new Map();
function enhEvidencePanel(t){const user=authSession('worker'),editable=jobsActor(t)&&['Accepted','In progress','Needs correction'].includes(t.status);return card('Job evidence attachments',(editable?'<label for="enh-evidence-files">Attach photos, PDF reports or video (up to 10 MB each)</label><input id="enh-evidence-files" type="file" multiple accept="image/jpeg,image/png,image/webp,application/pdf,video/mp4" onchange="enhAttachEvidence(&quot;'+t.id+'&quot;,this)">':'')+(t.attachments||[]).map(a=>row(esc(a.name),esc(a.type)+' · '+Math.ceil(a.size/1024)+' KB'+(enhEvidenceFiles.has(a.id)?'<a class="button secondary" href="'+esc(enhEvidenceFiles.get(a.id))+'" target="_blank" rel="noopener noreferrer">Preview</a>':'<small>Reattach after refresh for a file preview.</small>'))).join('')+note('Files are previewed on this device for this session. Metadata and submission references are retained; durable private uploads will be connected later.'));}
function enhAttachEvidence(id,input){const t=state.ops.tasks.find(t=>t.id===id),u=t&&jobsActor(t);if(!u||!['Accepted','In progress','Needs correction'].includes(t.status))return;const files=Array.from(input.files||[]);if((t.attachments?.length||0)+files.length>10||files.some(f=>f.size>10*1024*1024||!['image/jpeg','image/png','image/webp','application/pdf','video/mp4'].includes(f.type))){toast('Use at most 10 JPEG, PNG, WebP, PDF or MP4 files under 10 MB each.');return;}t.attachments=t.attachments||[];for(const f of files){const a={id:'EVID-'+authRandom(8),name:f.name,type:f.type,size:f.size,workerId:u.id,staffId:t.staffId,at:Date.now()};t.attachments.push(a);enhEvidenceFiles.set(a.id,URL.createObjectURL(f));}persist();jobsOpen(id);toast('Evidence attached locally. Add its reference or a report summary when submitting.');}
const enhEvidenceOpen=jobsOpen;jobsOpen=id=>{enhEvidenceOpen(id);const t=state.ops.tasks.find(t=>t.id===id);if(t&&(jobsManager()||jobsActor(t)))$('modal').innerHTML+=enhEvidencePanel(t);};opsOpenTask=jobsOpen;
const enhEvidenceTransition=jobsTransition;jobsTransition=(id,action,data={})=>{const t=state.ops.tasks.find(t=>t.id===id);const r=enhEvidenceTransition(id,action,data);if(r.ok&&action==='submit'){t.submissions[0].attachments=(t.attachments||[]).filter(a=>a.staffId===t.staffId&&a.workerId===authSession('worker')?.id).map(a=>authCopy(a));persist();}return r;};
function enhExportCatalog(){if(!jobsManager())return;const headers=['template_sku','sku','title','retail','bulk','volume','moq','pack','threshold'];const quote=v=>{let raw=String(v);if(typeof v==='string'&&/^[=+@\-\t\r]/.test(raw))raw=String.fromCharCode(39)+raw;return '"'+raw.replaceAll('"','""')+'"';};const csv=headers.join(',')+'\n'+products.map(p=>[p.id,p.id,p.name,p.retail,p.bulk,p.volume,p.moq,p.pack,p.volumeThreshold].map(quote).join(',')).join('\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='ChinaLowCost-Catalog.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Catalog exported. Change SKU values before importing as new drafts.');}
