name: Release to Contabo
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contabo-production
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: bash -n work/deploy/release.sh work/deploy/install-release-layout.sh
  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Deploy the verified commit
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ && "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ && "$SSH_PORT" =~ ^[0-9]{1,5}$ && "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          umask 077
          credentials=$(mktemp -d "$RUNNER_TEMP/chinalowcost-ssh.XXXXXX")
          trap 'rm -rf -- "$credentials"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$credentials/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$credentials/known_hosts"
          ssh -i "$credentials/key" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$credentials/known_hosts" -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" "bash /usr/local/sbin/chinalowcost-release $RELEASE_SHA"